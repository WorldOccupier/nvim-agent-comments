name: test

on:
  push:
  pull_request:

jobs:
  neovim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['v0.9.5', 'v0.10.4', 'stable']

    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.version }}
          neovim: true
      - run: make test
